name: ci

on:
  push:
    branches: ["19.0"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm test
      - run: python3 tests/check_module.py
  odoo-module:
    uses: DAADit/.github/.github/workflows/odoo-module-ci.yml@v1
    with:
      module_name: daadit_barcode_rs38
      lint_all: true
    secrets: inherit
