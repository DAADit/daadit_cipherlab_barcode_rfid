name: ci

on:
  push:
    branches: ["19.0"]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/check_module.py
      - run: for f in static/src/*.js; do node --check "$f"; done
  odoo-module:
    uses: DAADit/.github/.github/workflows/odoo-module-ci.yml@v1
    with:
      module_name: daadit_cipherlab_barcode_rfid
      lint_all: true
    secrets: inherit
